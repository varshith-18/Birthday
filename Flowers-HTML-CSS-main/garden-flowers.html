    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;

    body {
      min-height: 100vh;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      overflow: hidden;
      perspective: 1000px;
    }

      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 420px;
      transform: scale(1.02);
      transform-origin: 50% 85%;
      background: transparent;
      overflow: hidden;

      background: linear-gradient(135deg, #80b46b, #12381f);
      box-shadow: inset 0 0 5px rgba(255,255,255,0.2);

      left: 50%;
      top: 50%;
      width: 1.7vmin;
      height: 1.7vmin;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffeeb2, #cf8a64);
      box-shadow: 0 0 0 0.2vmin rgba(255,230,158,0.8), 0 0 1.5vmin 0.4vmin rgba(255,223,160,0.95);

    .flower__light {

    .flower__leafs--3 .flower__leaf {

</head>

    const flowerNodes = Array.from(document.querySelectorAll('.flower'));
    flowerNodes.forEach((flower, idx) => {
      flower.addEventListener('click', () => {
        flower.classList.add('blooming');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'flower-bloomed', flowerId: idx + 1 }, '*');

      });
